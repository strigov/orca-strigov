<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">orca-strigov — delegated work, verified progress</title>
  <desc id="desc">Conceptual phase view: an Orca development coordinator delegates to separate build, verification and review workers. Accepted work leads to the next authorized phase. The detailed workflow and hook limits are explained in the README.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#72DFC5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="12" fill="#0D161B"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="64" fill="#AFBABD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="2">CODEX PLUGIN / ORCA</text>
    <text x="60" y="164" fill="#F5F5EF" font-size="92" font-weight="700" letter-spacing="-3">orca-strigov</text>
    <text x="64" y="220" fill="#F5F5EF" font-size="36">Delegated work. Verified progress.</text>
  </g>

  <g id="dispatch" fill="none" stroke="#72DFC5" stroke-width="2">
    <path d="M580 360V388M204 388H956"/>
    <path d="M204 388V424" marker-end="url(#arrow)"/>
    <path d="M580 388V424" marker-end="url(#arrow)"/>
    <path d="M956 388V424" marker-end="url(#arrow)"/>
  </g>

  <g id="coordinator" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="400" y="280" width="360" height="80" rx="12" fill="#72DFC5"/>
    <text x="580" y="335" text-anchor="middle" fill="#0D161B" font-size="44" font-weight="600">Coordinator</text>
  </g>

  <g id="worker-roles" fill="#F5F5EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" text-anchor="middle">
    <g id="build-worker">
      <rect x="64" y="424" width="280" height="80" rx="12" fill="#0D161B" stroke="#34464D" stroke-width="2"/>
      <text x="204" y="479">Build</text>
    </g>
    <g id="verification-worker">
      <rect x="440" y="424" width="280" height="80" rx="12" fill="#0D161B" stroke="#34464D" stroke-width="2"/>
      <text x="580" y="479">Verify</text>
    </g>
    <g id="review-worker">
      <rect x="816" y="424" width="280" height="80" rx="12" fill="#0D161B" stroke="#34464D" stroke-width="2"/>
      <text x="956" y="479">Review</text>
    </g>
  </g>

  <g id="phase-continuation">
    <path d="M1096 464H1136V320H776" fill="none" stroke="#72DFC5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="956" y="298" text-anchor="middle" fill="#AFBABD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26">Next phase</text>
  </g>
</svg>
