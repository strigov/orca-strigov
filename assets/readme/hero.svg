<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">orca-dev — supervised multi-model delivery for Orca</title>
  <desc id="desc">A delivery route connects a plain-language request with planning, implementation, verification, and independent review.</desc>
  <rect width="1200" height="400" rx="28" fill="#07111F"/>
  <path d="M0 326H1200" stroke="#213249" stroke-width="2"/>
  <path d="M738 91H1132" stroke="#17283E" stroke-width="2"/>
  <g id="title-block" transform="translate(64 58)">
    <text x="0" y="0" fill="#8EA3BA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">ORCA DEVELOPMENT PROTOCOL</text>
    <text x="0" y="82" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="750">orca-dev</text>
    <text x="0" y="132" fill="#C7D3E0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28">Describe the result. Let specialists verify it.</text>
    <text x="0" y="177" fill="#8EA3BA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">One request → code, tests, reviews, and evidence.</text>
    <g transform="translate(0 220)">
