      <text x="102" y="35" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650">Build</text>
    </g>
    <g transform="translate(0 190)">
      <circle cx="58" cy="28" r="28" fill="#0D202A" stroke="#47D7BE" stroke-width="3"/>
      <text x="58" y="35" text-anchor="middle" fill="#F5F8FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">03</text>
      <text x="102" y="35" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650">Verify</text>
