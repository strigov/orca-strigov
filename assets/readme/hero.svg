      <circle cx="24" cy="23" r="6" fill="#47D7BE"/>
      <text x="42" y="30" fill="#DDFBF5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">vibe-coder friendly</text>
    </g>
  </g>
  <g id="delivery-route" transform="translate(734 0)">
