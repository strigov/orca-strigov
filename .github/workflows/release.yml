name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in the archive name
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build installation archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/orca-release"
          python3 bin/build-release.py \
            --repo "$GITHUB_WORKSPACE" \
            --version "$version" \
            --out "$RUNNER_TEMP/orca-release/orca-dev-$version.zip"
          unzip -l "$RUNNER_TEMP/orca-release/orca-dev-$version.zip"
      - name: Upload archive to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/orca-release/orca-dev-$version.zip" \
            "$RUNNER_TEMP/orca-release/orca-dev-$version.zip.sha256" \
            --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: orca-dev-${{ inputs.version }}
          path: ${{ runner.temp }}/orca-release/*
