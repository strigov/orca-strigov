name: Runtime contracts
# CI covers Linux only. macOS and native Windows (PowerShell 5.1 and pwsh 7) run
# the same suite locally before a push: docs/runtime-platforms.md#evidence-levels.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'README.ru.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'README.ru.md']
  workflow_dispatch:
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Native runtime and complete integration suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/orca-evidence"
          export ORCA_TEST_ARTIFACTS="$RUNNER_TEMP/orca-evidence/artifacts"
          export PYTHONDONTWRITEBYTECODE=1
          { uname -a; /bin/bash --version; python3 --version; git rev-parse HEAD; } > "$RUNNER_TEMP/orca-evidence/environment.log"
          python3 -B bin/lib/run_check.py capabilities 2>&1 | tee "$RUNNER_TEMP/orca-evidence/capabilities.log"
          ORCA_TEST_SHELL=/bin/bash python3 -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/orca-evidence/integration.log"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-ubuntu-latest
          path: ${{ runner.temp }}/orca-evidence
          include-hidden-files: true
