name: Runtime contracts
# Manual only: hosted runners are not paid for on this account. The suite runs
# locally on macOS and native Windows (PowerShell 5.1 and pwsh 7) before a merge:
# docs/runtime-platforms.md#evidence-levels. Start a Linux run by hand with
# `gh workflow run runtime.yml` when the account allows it.
on:
  workflow_dispatch:
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Native runtime and complete integration suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/orca-evidence"
          export ORCA_TEST_ARTIFACTS="$RUNNER_TEMP/orca-evidence/artifacts"
          export PYTHONDONTWRITEBYTECODE=1
          { uname -a; /bin/bash --version; python3 --version; git rev-parse HEAD; } > "$RUNNER_TEMP/orca-evidence/environment.log"
          python3 -B bin/lib/run_check.py capabilities 2>&1 | tee "$RUNNER_TEMP/orca-evidence/capabilities.log"
          ORCA_TEST_SHELL=/bin/bash python3 -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/orca-evidence/integration.log"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-ubuntu-latest
          path: ${{ runner.temp }}/orca-evidence
          include-hidden-files: true
