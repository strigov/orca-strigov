name: Runtime contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native runtime and complete integration suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/orca-evidence"
          export ORCA_TEST_ARTIFACTS="$RUNNER_TEMP/orca-evidence/artifacts"
          export PYTHONDONTWRITEBYTECODE=1
          { uname -a; /bin/bash --version; python3 --version; git rev-parse HEAD; } > "$RUNNER_TEMP/orca-evidence/environment.log"
          python3 -B bin/lib/run_check.py capabilities 2>&1 | tee "$RUNNER_TEMP/orca-evidence/capabilities.log"
          ORCA_TEST_SHELL=/bin/bash python3 -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/orca-evidence/integration.log"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/orca-evidence
          include-hidden-files: true
  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native PowerShell C3 and C4 regressions
        run: |
          $env:ORCA_TEST_SHELL=(Get-Process -Id $PID).Path
          $env:ORCA_TEST_ARTIFACTS="$env:RUNNER_TEMP/orca-evidence/directed-artifacts"
          $env:PYTHONUTF8='1'
          $env:PYTHONDONTWRITEBYTECODE='1'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/orca-evidence" | Out-Null
          $PSVersionTable | Out-File "$env:RUNNER_TEMP/orca-evidence/directed-environment.log"
          git rev-parse HEAD | Out-File -Append "$env:RUNNER_TEMP/orca-evidence/directed-environment.log"
          $testDriver = @'
          import subprocess, sys
          checks = ['test_duration_ticks_round_trip',
                    'test_status_name_stays_readable_across_replacements',
                    'test_diagnostic_wait_does_not_kill_or_claim_progress',
                    'test_copied_evidence_must_match_sealed_result']
          argv = [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v']
          for check in checks:
              argv.extend(['-k', check])
          with open(sys.argv[1], 'wb') as log:
              result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT)
          raise SystemExit(result.returncode)
          '@
          python -B -c $testDriver "$env:RUNNER_TEMP/orca-evidence/directed.log"
          $suiteCode=$LASTEXITCODE
          Get-Content -Encoding UTF8 "$env:RUNNER_TEMP/orca-evidence/directed.log"
          if ($suiteCode -ne 0) { exit $suiteCode }
      - name: Native PowerShell integration suite
        run: |
          $env:ORCA_TEST_SHELL=(Get-Process -Id $PID).Path
          $env:ORCA_TEST_ARTIFACTS="$env:RUNNER_TEMP/orca-evidence/artifacts"
          $env:PYTHONUTF8='1'
          $env:PYTHONDONTWRITEBYTECODE='1'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/orca-evidence" | Out-Null
          $PSVersionTable | Out-File "$env:RUNNER_TEMP/orca-evidence/environment.log"
          git rev-parse HEAD | Out-File -Append "$env:RUNNER_TEMP/orca-evidence/environment.log"
          # PS5.1 treats redirected native stderr as PowerShell errors under Stop.
          # Let Python retain both streams and propagate the actual suite exit.
          $testDriver = @'
          import subprocess, sys
          with open(sys.argv[1], 'wb') as log:
              result = subprocess.run(
                  [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                  stdout=log, stderr=subprocess.STDOUT)
          raise SystemExit(result.returncode)
          '@
          python -B -c $testDriver "$env:RUNNER_TEMP/orca-evidence/integration.log"
          $suiteCode=$LASTEXITCODE
          Get-Content -Encoding UTF8 "$env:RUNNER_TEMP/orca-evidence/integration.log"
          if ($suiteCode -ne 0) { exit $suiteCode }
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-windows-${{ matrix.shell }}
          path: ${{ runner.temp }}/orca-evidence
          include-hidden-files: true
